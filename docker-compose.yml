# Docker Compose for Fli MCP Server
# Usage: docker compose up -d
#
# MCP endpoints (dual transport mode - default):
#   SSE:  http://localhost:8000/sse (+ /messages/ for posting)
#   HTTP: http://localhost:8000/mcp
#
# Available transport modes (set via command override):
#   fli-mcp-dual  - Both SSE and HTTP (default)
#   fli-mcp-sse   - SSE only
#   fli-mcp-http  - HTTP only

services:
  fli-mcp:
    image: ashayc/fli-mcp:latest
    # To build locally instead of using pre-built image, comment out 'image' and uncomment 'build':
    # build: .
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # Optional MCP server configuration:
      # - FLI_MCP_DEFAULT_PASSENGERS=1
      # - FLI_MCP_DEFAULT_CURRENCY=USD
      # - FLI_MCP_DEFAULT_CABIN_CLASS=ECONOMY
      # - FLI_MCP_DEFAULT_SORT_BY=CHEAPEST
      # - FLI_MCP_MAX_RESULTS=10
    restart: unless-stopped
    # Override transport mode if needed:
    # command: ["fli-mcp-sse"]   # SSE only
    # command: ["fli-mcp-http"]  # HTTP only
